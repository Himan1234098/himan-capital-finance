<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909"><title>Himan Capital Finance | Cyber Cafe Portal</title>
<style>
:root{--bg:#090909;--panel:#151515;--panel2:#1c1a16;--gold:#d8ad55;--gold2:#f3d58b;--text:#f7f3e9;--muted:#aaa397;--line:#40351f;--red:#d97777;--green:#82c69b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#2a2112 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.55 system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#0d0d0d;border-right:1px solid var(--line);padding:22px 15px;position:sticky;top:0;height:100vh;overflow:auto}.logo{padding:4px 10px 24px;color:var(--gold2);font-weight:900;letter-spacing:1px;font-size:17px}.logo small{display:block;color:#93866c;font-size:10px;letter-spacing:2px}.navgroup{color:#887b62;font-size:10px;text-transform:uppercase;letter-spacing:2px;padding:14px 10px 7px}.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;background:none;border:0;color:#c9c2b5;text-align:left;border-radius:9px;margin:2px 0}.nav button:hover,.nav button.active{background:linear-gradient(90deg,#3a2d17,#211b11);color:var(--gold2)}.nav .ico{width:20px;text-align:center}.main{min-width:0}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#090909cc;position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}.top strong{color:var(--gold2)}.content{padding:28px;max-width:1400px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.pagehead h1{font-size:26px;margin:0;color:var(--gold2)}.sub{color:var(--muted);margin-top:4px}.btn{border:1px solid var(--gold);background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17120a;padding:10px 15px;border-radius:8px;font-weight:750}.btn.secondary{background:#211b11;color:var(--gold2)}.btn.danger{background:#351b1b;color:#ffc4c4;border-color:#754040}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card,.panel{background:linear-gradient(145deg,#1b1a17,#111);border:1px solid var(--line);border-radius:13px;padding:18px}.stat{color:var(--muted);font-size:12px}.num{font-size:29px;font-weight:850;color:var(--gold2);margin-top:5px}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.panel h3{margin:0 0 14px;color:var(--gold2)}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{padding:16px 10px;border:1px solid #453820;background:#17140f;color:#e9d9b5;border-radius:10px;text-align:left}.quick button span{display:block;font-size:22px;margin-bottom:7px}.quick button:hover{border-color:var(--gold);background:#241d12}.notice{border:1px solid #6b552d;background:#211b10;color:#e8d5aa;padding:12px 14px;border-radius:9px;margin-bottom:18px}.muted{color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}label{font-size:12px;color:#d9c99f}input,select,textarea{width:100%;background:#0b0b0b;border:1px solid #4a402c;color:#fff;border-radius:8px;padding:11px}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #30291e;font-size:12px}th{color:var(--gold2);font-weight:700}td{color:#ddd}.pill{border-radius:30px;padding:3px 8px;background:#2b2417;color:#e9d39f;font-size:11px}.empty{color:#948d80;padding:20px;text-align:center}.hidden{display:none!important}.preview{background:white;color:#111;padding:22px;border-radius:8px;min-height:150px}.preview img{max-width:100%;max-height:180px;object-fit:contain}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.foot{color:#7f786d;text-align:center;font-size:11px;padding:30px 0}.mobilemenu{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:20;left:-270px;width:250px;transition:.2s}.side.open{left:0}.mobilemenu{display:inline-block}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.content{padding:18px}.top{padding:0 16px}}
@media(max-width:540px){.cards{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.num{font-size:23px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.quick{grid-template-columns:repeat(2,1fr)}.pagehead{align-items:flex-start;flex-direction:column}}
@media print{.side,.top,.no-print,.pagehead,.foot{display:none!important}.app{display:block}.content{padding:0}.preview{border:0}}
</style></head>
<body>
<div class="app">
<aside class="side" id="sidebar"><div class="logo">HIMAN CAPITAL FINANCE<small>DIGITAL SERVICE & CAFE PORTAL</small></div><nav class="nav">
<div class="navgroup">Overview</div><button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
<div class="navgroup">Document Studio</div><button data-page="a4"><span class="ico">▤</span>Document A4 Maker</button><button data-page="idcard"><span class="ico">▣</span>ID Card A4 Maker</button><button data-page="photo"><span class="ico">📷</span>Passport Photo Maker</button><button data-page="cv"><span class="ico">📄</span>CV Maker</button><button data-page="handwriting"><span class="ico">✍</span>Handwriting to Word</button><button data-page="ready"><span class="ico">🗂</span>Ready-made Documents</button>
<div class="navgroup">Shop Management</div><button data-page="customers"><span class="ico">♙</span>Customer Management</button><button data-page="jobs"><span class="ico">◷</span>Job History & Search</button><button data-page="print"><span class="ico">🖨</span>Print Management</button><button data-page="online"><span class="ico">🌐</span>Online Services & Schemes</button><button data-page="loans"><span class="ico">₹</span>Loan Applications</button>
<div class="navgroup">Administration</div><button data-page="backup"><span class="ico">☁</span>Admin & Backup</button>
</nav></aside>
<main class="main"><header class="top"><div><button class="btn secondary mobilemenu" id="menu">☰</button> <strong>Black & Gold Workspace</strong></div><div class="muted" id="today"></div></header><div class="content">
<div id="page"></div><div class="foot">© <span id="year"></span> Himan Capital Finance · Local demo workspace</div>
</div></main></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='hcf_portal_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"customers":[],"jobs":[],"loans":[],"prints":[]}');
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const pages={
dashboard:()=>`<div class="pagehead"><div><h1>Dashboard</h1><div class="sub">আপনার সাইবার ক্যাফের কাজ এক জায়গা থেকে পরিচালনা করুন</div></div><button class="btn" onclick="go('jobs')">＋ New Job</button></div>
<div class="notice">🔒 এটি একটি লোকাল ডেমো। ডেটা এই ব্রাউজারের Local Storage-এ থাকে। বাস্তব গ্রাহকের Aadhaar, PAN, OTP, ব্যাংক তথ্য বা সংবেদনশীল ডকুমেন্ট এখানে সংরক্ষণ করবেন না।</div>
<div class="cards"><div class="card"><div class="stat">Total Customers</div><div class="num">${db.customers.length}</div></div><div class="card"><div class="stat">Total Jobs</div><div class="num">${db.jobs.length}</div></div><div class="card"><div class="stat">Loan Enquiries</div><div class="num">${db.loans.length}</div></div><div class="card"><div class="stat">Print Queue</div><div class="num">${db.prints.length}</div></div></div>
<div class="grid2"><div class="panel"><h3>Quick Access</h3><div class="quick"><button onclick="go('a4')"><span>▤</span>A4 Maker</button><button onclick="go('idcard')"><span>▣</span>ID Card Sheet</button><button onclick="go('photo')"><span>📷</span>Photo Maker</button><button onclick="go('cv')"><span>📄</span>CV Maker</button><button onclick="go('ready')"><span>🗂</span>Ready Documents</button><button onclick="go('customers')"><span>♙</span>Customers</button></div></div><div class="panel"><h3>Recent Jobs</h3>${db.jobs.slice(-5).reverse().map(j=>`<p>• ${esc(j.title)} <span class="pill">${esc(j.status)}</span></p>`).join('')||'<div class="empty">এখনও কোনো কাজ যোগ হয়নি</div>'}</div></div>`,
a4:()=>maker('Document A4 Maker','A4 পেজে টেক্সট/ডকুমেন্ট সাজিয়ে প্রিন্ট বা PDF করুন','document'),
idcard:()=>`<div class="pagehead"><div><h1>ID Card A4 Maker</h1><div class="sub">একাধিক ID কার্ডের ছবি A4 শিটে সাজান</div></div></div><div class="panel"><div class="formgrid"><div class="field"><label>ID Card Image</label><input id="idfiles" type="file" accept="image/*" multiple></div><div class="field"><label>Cards per row</label><select id="idcols"><option>2</option><option>3</option><option>4</option></select></div></div><div class="actions"><button class="btn" onclick="idPreview()">Create A4 Sheet</button><button class="btn secondary" onclick="printArea('idpreview')">Print / Save PDF</button></div><div id="idpreview" class="preview" style="margin-top:15px"></div></div>`,
photo:()=>`<div class="pagehead"><div><h1>Passport Photo Maker</h1><div class="sub">ছবি আপলোড করে একাধিক কপি প্রিন্ট শিটে সাজান</div></div></div><div class="panel"><div class="formgrid"><div class="field"><label>Photo Upload</label><input id="photofile" type="file" accept="image/*"></div><div class="field"><label>Copies</label><input id="copies" type="number" min="1" max="48" value="8"></div></div><div class="actions"><button class="btn" onclick="photoPreview()">Generate Photo Sheet</button><button class="btn secondary" onclick="printArea('photopreview')">Print / Save PDF</button></div><p class="note">ডিফল্টে ৩৫×৪৫ মিমি অনুপাতের কাছাকাছি প্রিভিউ; সরকারি/পরীক্ষার নির্দিষ্ট মাপ আলাদা করে যাচাই করুন।</p><div id="photopreview" class="preview" style="margin-top:15px"></div></div>`,
cv:()=>`<div class="pagehead"><div><h1>CV Maker</h1><div class="sub">তথ্য লিখে একটি সাধারণ CV তৈরি করুন</div></div></div><div class="panel"><div class="formgrid"><div class="field"><label>Full Name</label><input id="cvname" placeholder="Your name"></div><div class="field"><label>Mobile / Email</label><input id="cvcontact" placeholder="Contact details"></div><div class="field"><label>Address</label><input id="cvaddress"></div><div class="field"><label>Education</label><input id="cvedu" placeholder="Qualification"></div><div class="field full"><label>Skills</label><textarea id="cvskills"></textarea></div><div class="field full"><label>Experience / Objective</label><textarea id="cvexp"></textarea></div></div><div class="actions"><button class="btn" onclick="cvPreview()">Generate CV</button><button class="btn secondary" onclick="printArea('cvpreview')">Print / Save PDF</button></div><div id="cvpreview" class="preview" style="margin-top:15px"></div></div>`,
handwriting:()=>`<div class="pagehead"><div><h1>Handwriting to Word</h1><div class="sub">হাতে লেখা পেজের ছবি থেকে টেক্সট শনাক্ত করার ওয়ার্কফ্লো</div></div></div><div class="notice">OCR-এর জন্য অনলাইন OCR ইঞ্জিন বা আলাদা ইনস্টলেশন প্রয়োজন। এই ডেমোতে ছবি দেখা ও OCR টেক্সট হাতে সংশোধন/কপি করার জায়গা আছে; স্বয়ংক্রিয় OCR এখনো সংযুক্ত নয়।</div><div class="panel"><div class="field"><label>Upload handwriting image</label><input id="hwfile" type="file" accept="image/*"></div><div id="hwimg"></div><div class="field" style="margin-top:12px"><label>Recognized / corrected text</label><textarea id="hwtext" placeholder="OCR থেকে পাওয়া লেখা এখানে পেস্ট করুন বা টাইপ করুন..."></textarea></div><div class="actions"><button class="btn" onclick="downloadText()">Download .txt</button><button class="btn secondary" onclick="copyText()">Copy Text</button></div></div>`,
ready:()=>`<div class="pagehead"><div><h1>Ready-made Documents</h1><div class="sub">সাধারণ আবেদনপত্রের খসড়া তৈরি করুন</div></div></div><div class="panel"><div class="field"><label>Template</label><select id="template"><option value="leave">ছুটির আবেদন</option><option value="address">ঠিকানা সংশোধনের আবেদন</option><option value="general">সাধারণ দরখাস্ত</option><option value="income">আয়ের শংসাপত্রের জন্য আবেদন</option></select></div><div class="formgrid" style="margin-top:12px"><div class="field"><label>নাম</label><input id="rname"></div><div class="field"><label>প্রাপক / অফিস</label><input id="rto" placeholder="প্রধান শিক্ষক / BDO ইত্যাদি"></div><div class="field"><label>তারিখ</label><input id="rdate" type="date"></div><div class="field"><label>বিষয় / কারণ</label><input id="rsubject"></div></div><div class="actions"><button class="btn" onclick="readyPreview()">খসড়া তৈরি</button><button class="btn secondary" onclick="printArea('readypreview')">Print / PDF</button></div><div id="readypreview" class="preview" style="margin-top:15px"></div></div>`,
customers:()=>`<div class="pagehead"><div><h1>Customer Management</h1><div class="sub">গ্রাহকের নাম ও যোগাযোগের তথ্য</div></div></div><div class="panel"><div class="formgrid"><div class="field"><label>Customer Name</label><input id="cname"></div><div class="field"><label>Mobile Number</label><input id="cmobile" inputmode="numeric"></div><div class="field full"><label>Notes (সাধারণ নোট; সংবেদনশীল তথ্য নয়)</label><input id="cnote"></div></div><div class="actions"><button class="btn" onclick="addCustomer()">Save Customer</button></div></div><div class="panel" style="margin-top:15px"><h3>Customer List</h3><div class="tablewrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>Notes</th><th>Action</th></tr></thead><tbody>${db.customers.map((c,i)=>`<tr><td>${esc(c.name)}</td><td>${esc(c.mobile)}</td><td>${esc(c.note)}</td><td><button class="btn danger" onclick="del('customers',${i})">Delete</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No customers yet</td></tr>'}</tbody></table></div></div>`,
jobs:()=>`<div class="pagehead"><div><h1>Job History & Search</h1><div class="sub">নতুন কাজ যোগ করুন এবং আগের কাজ খুঁজুন</div></div></div><div class="panel"><div class="formgrid"><div class="field"><label>Customer Name</label><input id="jcustomer"></div><div class="field"><label>Mobile</label><input id="jmobile"></div><div class="field"><label>Job / Service</label><input id="jtitle" placeholder="যেমন PAN form / Photo print"></div><div class="field"><label>Status</label><select id="jstatus"><option>Pending</option><option>In Progress</option><option>Completed</option><option>Delivered</option></select></div></div><div class="actions"><button class="btn" onclick="addJob()">Add Job</button></div></div><div class="panel" style="margin-top:15px"><div class="field"><label>Search jobs</label><input id="jobsearch" oninput="filterJobs()" placeholder="নাম, মোবাইল বা কাজের নাম লিখুন"></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Mobile</th><th>Job</th><th>Status</th></tr></thead><tbody id="jobrows">${jobRows()}</tbody></table></div></div>`,
print:()=>`<div class="pagehead"><div><h1>Print Management</h1><div class="sub">প্রিন্ট কাজের হিসাব রাখুন</div></div></div><div class="panel"><div class="formgrid"><div class="field"><label>Customer</label><input id="pcustomer"></div><div class="field"><label>Print Type</label><select id="ptype"><option>A4 B/W</option><option>A4 Colour</option><option>Photo</option><option>ID Card</option><option>Scan</option></select></div><div class="field"><label>Copies / Pages</label><input id="pqty" type="number" min="1" value="1"></div><div class="field"><label>Amount (₹)</label><input id="pamount" type="number" min="0" value="0"></div></div><div class="actions"><button class="btn" onclick="addPrint()">Add Print Job</button></div></div><div class="panel" style="margin-top:15px"><h3>Print Queue / Log</h3><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Type</th><th>Qty</th><th>Amount</th><th>Date</th></tr></thead><tbody>${db.prints.map(p=>`<tr><td>${esc(p.customer)}</td><td>${esc(p.type)}</td><td>${p.qty}</td><td>₹${p.amount}</td><td>${p.date}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No print jobs</td></tr>'}</tbody></table></div></div>`,
online:()=>`<div class="pagehead"><div><h1>Online Services & Government Schemes</h1><div class="sub">পরিষেবার তালিকা ও গ্রাহককে প্রয়োজনীয় তথ্য দিন</div></div></div><div class="notice">সরকারি প্রকল্পের যোগ্যতা, নথি ও আবেদনের নিয়ম পরিবর্তিত হতে পারে। আবেদন করার আগে সংশ্লিষ্ট সরকারি পোর্টালে যাচাই করুন।</div><div class="cards">${[['🪪','PAN / Voter','Application, correction & status guidance'],['🛂','Passport','Application & appointment support'],['🏛️','Government Schemes','Scheme information & form assistance'],['📜','Certificates','Income, caste, residence etc.'],['🧾','GST / FSSAI / Trade','Business registration guidance'],['🎫','Ticket Booking','Travel booking assistance'],['💻','Other Online Forms','Registration and application help'],['🖨️','Print / Scan','Document services']].map(x=>`<div class="card"><div style="font-size:25px">${x[0]}</div><h3 style="color:var(--gold2)">${x[1]}</h3><div class="muted">${x[2]}</div></div>`).join('')}</div>`,
loans:()=>`<div class="pagehead"><div><h1>Loan Application Management</h1><div class="sub">গ্রাহকের প্রাথমিক loan enquiry নথিভুক্ত করুন</div></div></div><div class="notice">এটি কেবল enquiry tracker, loan approval বা lender-এর প্রতিনিধিত্ব নয়। গ্রাহকের PAN/Aadhaar নম্বর, ব্যাংক তথ্য, OTP বা নথি এখানে রাখবেন না।</div><div class="panel"><div class="formgrid"><div class="field"><label>Customer Name</label><input id="lname"></div><div class="field"><label>Mobile</label><input id="lmobile"></div><div class="field"><label>Loan Type</label><select id="ltype"><option>Personal Loan</option><option>Business Loan</option><option>Home Loan</option><option>Other</option></select></div><div class="field"><label>Enquiry Amount (₹)</label><input id="lamount" type="number"></div><div class="field"><label>Status</label><select id="lstatus"><option>New Enquiry</option><option>Documents Pending</option><option>Under Review</option><option>Referred to Lender</option><option>Closed</option></select></div></div><div class="actions"><button class="btn" onclick="addLoan()">Save Enquiry</button></div></div><div class="panel" style="margin-top:15px"><h3>Loan Enquiries</h3><div class="tablewrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead><tbody>${db.loans.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.mobile)}</td><td>${esc(l.type)}</td><td>₹${l.amount}</td><td><span class="pill">${esc(l.status)}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No enquiries</td></tr>'}</tbody></table></div></div>`,
backup:()=>`<div class="pagehead"><div><h1>Admin Panel & Backup</h1><div class="sub">ডেমো ডেটা export / import করুন</div></div></div><div class="notice">এই ডেমোতে আলাদা login/authentication বা cloud backup নেই। এটি production admin panel নয়। একাধিক কম্পিউটারে sync করতে secure backend, user login ও database প্রয়োজন।</div><div class="grid2"><div class="panel"><h3>Backup</h3><p class="muted">এই ব্রাউজারে থাকা গ্রাহক, কাজ, প্রিন্ট ও enquiry ডেটার JSON কপি নিন।</p><div class="actions"><button class="btn" onclick="backup()">Download Backup</button><label class="btn secondary">Restore Backup<input type="file" id="restore" accept="application/json" hidden onchange="restore(this)"></label></div></div><div class="panel"><h3>Workspace Info</h3><p>Customers: <b>${db.customers.length}</b></p><p>Jobs: <b>${db.jobs.length}</b></p><p>Print records: <b>${db.prints.length}</b></p><p>Loan enquiries: <b>${db.loans.length}</b></p><button class="btn danger" onclick="if(confirm('সব লোকাল ডেটা মুছে ফেলবেন?')){db={customers:[],jobs:[],loans:[],prints:[]};save()}">Clear All Demo Data</button></div></div>`
};
function maker(title,desc,kind){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${desc}</div></div></div><div class="panel"><div class="field"><label>Document Title</label><input id="doctitle" placeholder="Document title"></div><div class="field" style="margin-top:12px"><label>Document Text</label><textarea id="doctext" style="min-height:260px" placeholder="এখানে ডকুমেন্টের লেখা লিখুন বা পেস্ট করুন..."></textarea></div><div class="actions"><button class="btn" onclick="docPreview()">Preview A4</button><button class="btn secondary" onclick="printArea('docpreview')">Print / Save PDF</button><button class="btn secondary" onclick="downloadDoc()">Download .txt</button></div><div id="docpreview" class="preview" style="margin-top:15px"></div></div>`}
function render(){let p=location.hash.slice(1)||'dashboard';if(!pages[p])p='dashboard';$('#page').innerHTML=pages[p]();$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#today').textContent=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});$('#year').textContent=new Date().getFullYear();if(p==='handwriting')$('#hwfile')?.addEventListener('change',e=>showFile(e.target.files[0],'hwimg'))}
function go(p){location.hash=p;$('#sidebar').classList.remove('open')}window.addEventListener('hashchange',render);$('#menu').onclick=()=>$('#sidebar').classList.toggle('open');$$('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function printArea(id){let el=document.getElementById(id);if(!el||!el.innerHTML.trim()){alert('আগে Preview তৈরি করুন');return}let w=window.open('','_blank');w.document.write(`<html><head><title>Print</title><style>body{font-family:Arial;padding:20mm;color:#111;white-space:normal}img{max-width:100%}</style></head><body>${el.innerHTML}</body></html>`);w.document.close();w.focus();w.print()}
function docPreview(){let t=esc($('#doctitle').value||'Document'),v=esc($('#doctext').value).replace(/\n/g,'<br>');$('#docpreview').innerHTML=`<h2 style="text-align:center">${t}</h2><div>${v}</div>`}
function download(name,content,type='text/plain'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function downloadDoc(){download('document.txt',($('#doctitle').value||'')+'\n\n'+($('#doctext').value||''))}
function addCustomer(){let name=$('#cname').value.trim(),mobile=$('#cmobile').value.trim();if(!name||!mobile)return alert('নাম ও মোবাইল দিন');db.customers.push({name,mobile,note:$('#cnote').value});save()}
function addJob(){let title=$('#jtitle').value.trim();if(!title)return alert('কাজের নাম লিখুন');db.jobs.push({customer:$('#jcustomer').value,mobile:$('#jmobile').value,title,status:$('#jstatus').value,date:new Date().toLocaleDateString('en-IN')});save()}
function jobRows(q=''){return db.jobs.slice().reverse().filter(j=>(j.customer+j.mobile+j.title+j.status).toLowerCase().includes(q.toLowerCase())).map(j=>`<tr><td>${j.date}</td><td>${esc(j.customer)}</td><td>${esc(j.mobile)}</td><td>${esc(j.title)}</td><td><span class="pill">${esc(j.status)}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">কোনো কাজ পাওয়া যায়নি</td></tr>'}
function filterJobs(){$('#jobrows').innerHTML=jobRows($('#jobsearch').value)}
function addPrint(){db.prints.push({customer:$('#pcustomer').value,type:$('#ptype').value,qty:+$('#pqty').value,amount:+$('#pamount').value,date:new Date().toLocaleDateString('en-IN')});save()}
function addLoan(){let name=$('#lname').value.trim();if(!name)return alert('গ্রাহকের নাম লিখুন');db.loans.push({name,mobile:$('#lmobile').value,type:$('#ltype').value,amount:+$('#lamount').value,status:$('#lstatus').value});save()}
function del(k,i){if(confirm('মুছে ফেলবেন?')){db[k].splice(i,1);save()}}
function backup(){download('himan-capital-finance-backup.json',JSON.stringify(db,null,2),'application/json')}
function restore(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.customers||!x.jobs||!x.loans||!x.prints)throw 0;db=x;save();alert('Backup restored')}catch(e){alert('ফাইলটি সঠিক backup নয়')}};r.readAsText(f)}
function addImages(files,target,cols){let urls=[...files].map(f=>URL.createObjectURL(f));document.getElementById(target).innerHTML=`<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:12px">${urls.map(u=>`<div style="border:1px solid #aaa;padding:4px"><img src="${u}" style="width:100%;height:125px;object-fit:contain"></div>`).join('')}</div>`}
function idPreview(){let f=$('#idfiles').files;if(!f.length)return alert('ID card image দিন');addImages(f,'idpreview',+$('#idcols').value)}
function photoPreview(){let f=$('#photofile').files[0],n=Math.min(48,Math.max(1,+$('#copies').value||8));if(!f)return alert('একটি ছবি আপলোড করুন');let u=URL.createObjectURL(f);$('#photopreview').innerHTML=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">${Array.from({length:n},()=>`<div style="border:1px solid #aaa;padding:3px"><img src="${u}" style="width:100%;aspect-ratio:7/9;object-fit:cover"></div>`).join('')}</div>`}
function cvPreview(){let g=id=>esc(document.getElementById(id).value).replace(/\n/g,'<br>');$('#cvpreview').innerHTML=`<h1 style="color:#222;margin:0">${g('cvname')}</h1><p>${g('cvcontact')} · ${g('cvaddress')}</p><hr><h3>Education</h3><p>${g('cvedu')}</p><h3>Skills</h3><p>${g('cvskills')}</p><h3>Experience / Objective</h3><p>${g('cvexp')}</p>`}
function readyPreview(){let names={leave:'ছুটির আবেদন',address:'ঠিকানা সংশোধনের আবেদন',general:'সাধারণ দরখাস্ত',income:'আয়ের শংসাপত্রের জন্য আবেদন'},name=esc($('#rname').value),to=esc($('#rto').value),date=esc($('#rdate').value),sub=esc($('#rsubject').value);$('#readypreview').innerHTML=`<p style="text-align:right">তারিখ: ${date}</p><p>প্রাপক,<br>${to}</p><h3 style="text-align:center;text-decoration:underline">${names[$('#template').value]}</h3><p>বিষয়: ${sub}</p><p>মহাশয়/মহাশয়া,<br>বিনীত নিবেদন এই যে, আমি ${name}। ${sub} সংক্রান্ত বিষয়ে আপনার সদয় বিবেচনা ও প্রয়োজনীয় ব্যবস্থা গ্রহণের জন্য আবেদন জানাচ্ছি।</p><p>ধন্যবাদান্তে,<br>বিনীত<br>${name}</p><p>স্বাক্ষর: __________________</p>`}
function showFile(f,target){if(!f)return;let u=URL.createObjectURL(f);document.getElementById(target).innerHTML=`<img src="${u}" style="max-width:100%;max-height:260px;margin-top:12px">`}
function downloadText(){download('handwriting-text.txt',$('#hwtext').value)}
function copyText(){navigator.clipboard?.writeText($('#hwtext').value).then(()=>alert('Copied')).catch(()=>alert('Copy not available'))}
render();
</script></body></html>
